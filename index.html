<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tournée Piscines</title>
<meta name="theme-color" content="#0B6D88">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tournée">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: outil de terrain, une colonne au téléphone (en-tête collant, cartes de passage, barre d'onglets en bas) ; sur grand écran la semaine s'ouvre en colonnes */
:root{
  --bg:#EDF2F3; --surface:#FFFFFF; --surface-2:#E2EAEC; --line:#CCD8DB; --fg:#0F2229; --muted:#536770;
  --accent:#0B6D88; --accent-fg:#FFFFFF; --accent-soft:#D3EAF1;
  --ok:#1B7647; --ok-soft:#DBEFE3; --warn:#94570A; --warn-soft:#FAE9CC; --bad:#B0281F; --bad-soft:#F9DEDA;
  --scrim:rgba(6,20,26,.52); --shadow:0 1px 2px rgba(15,34,41,.06),0 8px 24px rgba(15,34,41,.10);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --tabh:62px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A161B; --surface:#112229; --surface-2:#182E36; --line:#27414B; --fg:#E3EEF1; --muted:#93A9B2;
  --accent:#4CB5D2; --accent-fg:#04212A; --accent-soft:#103A47;
  --ok:#51C68B; --ok-soft:#113626; --warn:#EFA640; --warn-soft:#3A2A0F; --bad:#F27A6F; --bad-soft:#3F1814;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A161B; --surface:#112229; --surface-2:#182E36; --line:#27414B; --fg:#E3EEF1; --muted:#93A9B2;
  --accent:#4CB5D2; --accent-fg:#04212A; --accent-soft:#103A47;
  --ok:#51C68B; --ok-soft:#113626; --warn:#EFA640; --warn-soft:#3A2A0F; --bad:#F27A6F; --bad-soft:#3F1814;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
img[data-blob]{background:var(--surface-2)}
html{-webkit-tap-highlight-color:transparent}
html.locked, html.locked body{overflow:hidden}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.1rem}
p{margin:0}
small{font-size:.8em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .sm{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand-tab{color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sync.ok::before{background:var(--ok)} .sync.bad::before{background:var(--bad)}

main{padding-block:16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px)}
main > .wrap{display:grid;gap:16px}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px}
.tabs button{appearance:none;border:0;background:none;height:var(--tabh);display:grid;place-items:center;align-content:center;gap:2px;color:var(--muted);font-size:.74rem;font-weight:600;letter-spacing:.02em;cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .count{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;display:grid;place-items:center}

/* Boutons */
.btn{appearance:none;border:1px solid transparent;background:var(--surface-2);color:var(--fg);min-height:44px;padding:0 16px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{appearance:none;border:0;background:transparent;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}

/* Planning */
.weekbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.weeknav{display:flex;align-items:center;gap:4px}
.weektitle{display:grid;line-height:1.15;min-width:0}
.weektitle strong{font-family:var(--f-display);font-size:1.35rem}
.weektitle span{color:var(--muted);font-size:.9rem}
.weekactions{display:flex;gap:8px;flex-wrap:wrap}
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daychip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 4px;display:grid;justify-items:center;gap:0;cursor:pointer;min-width:0}
.daychip span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.daychip b{font-family:var(--f-display);font-size:1.3rem;line-height:1.1}
.daychip i{font-style:normal;font-size:.75rem;color:var(--muted);min-height:1em}
.daychip.today b{color:var(--accent)}
.daychip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.daychip.sel span,.daychip.sel i,.daychip.sel b{color:var(--accent-fg)}
.daychip.drop,.daylist.drop{outline:2px dashed var(--accent);outline-offset:2px}
.weekgrid{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:12px;align-items:start}
.day{display:grid;gap:10px;min-width:0}
.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
.dayhead h3 .tag{font-family:var(--f-body);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:6px;vertical-align:middle}
.dayhead p{font-size:.86rem;color:var(--muted)}
.dayact{display:flex;gap:6px;flex-wrap:wrap}
.weekgrid .dayact .btn{flex:1}
.daylist{display:grid;gap:0;min-height:72px;border-radius:var(--r)}
.daylist .empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:.9rem;text-align:center}
.conn{display:flex;align-items:center;gap:6px;padding:5px 0 5px 14px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.conn svg{width:16px;height:16px}
.stop{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.stop+.stop{margin-top:8px}
.stop.prio{border-color:var(--bad)}
.stop.done{background:var(--surface-2)}
.stop.done strong{color:var(--muted)}
.stop.dragging{opacity:.3}
.stop.drop-before{box-shadow:0 -3px 0 var(--accent)}
.stop.drop-after{box-shadow:0 3px 0 var(--accent)}
.handle{appearance:none;border:0;background:transparent;width:38px;flex:none;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;border-radius:var(--r) 0 0 var(--r)}
.handle:active{cursor:grabbing}
.stop-main{appearance:none;border:0;background:transparent;text-align:left;padding:10px 12px 10px 0;flex:1;min-width:0;display:grid;gap:4px;cursor:pointer;color:inherit}
.stop-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.stop-top strong{font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eta{font-family:var(--f-display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.stop-sub{font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{display:block;font-size:.84rem;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:4px 8px}
.ghost-card{position:fixed;pointer-events:none;z-index:70;box-shadow:var(--shadow);transform:rotate(1.2deg);opacity:.95}
.reminders{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.reminders ul{margin:0;padding-left:18px;display:grid;gap:2px}
.reminders h3{font-size:1rem}

/* Badges et pastilles */
.badges,.chips{display:flex;flex-wrap:wrap;gap:5px}
.badge,.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--fg);white-space:nowrap;font-variant-numeric:tabular-nums}
.stop.done .chip,.stop.done .badge{background:var(--surface)}
.badge.ok,.chip.s-ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn,.chip.s-warn{background:var(--warn-soft);color:var(--warn)}
.badge.prio,.badge.bad,.chip.s-bad{background:var(--bad-soft);color:var(--bad)}
.chip small{font-weight:500;opacity:.8}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px var(--line);flex:none}

/* Cartes génériques */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:1.1rem;text-transform:uppercase;letter-spacing:.04em}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 16px;margin:0}
.facts div{display:grid;gap:2px;min-width:0}
.facts dt{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:grid;gap:10px;justify-items:start}
.empty-state h2{font-size:1.3rem}
.empty-state p{color:var(--muted);max-width:60ch}
.loading{padding:40px 0;color:var(--muted)}
.banner{background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:12px 14px}

/* Piscines */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:180px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.pcard{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px;display:flex;gap:12px;cursor:pointer;color:inherit;min-width:0}
.pcard img,.pthumb{width:72px;height:72px;border-radius:9px;object-fit:cover;flex:none;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.pbody{display:grid;gap:4px;min-width:0;align-content:start}
.pbody strong{font-size:1.05rem}
.pbody .muted{font-size:.86rem}
.fiche{display:grid;gap:14px}
.back{justify-self:start}
.fiche-head{display:grid;gap:14px}
.fiche-photo{width:100%;max-height:300px;object-fit:cover;border-radius:var(--r);aspect-ratio:16/8;max-width:100%}
.fiche-title{display:grid;gap:8px}
.fiche-title p{color:var(--muted)}
.fiche-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.callout{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.callout.bad{background:var(--bad-soft);color:var(--bad)}
.callout.info{background:var(--accent-soft);color:var(--accent)}
.measures{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.measure{display:grid;gap:4px}
.measure span{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.spark{width:100%;max-width:200px;height:auto;display:block}
.sp-band{fill:var(--ok-soft)} .sp-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round} .sp-dot{fill:var(--accent)}
.hlist{display:grid;gap:6px}
.hrow{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;color:inherit;min-width:0}
.hrow img{width:48px;height:48px;border-radius:7px;object-fit:cover;flex:none}
.hrow .hb{display:grid;gap:4px;min-width:0}
.eqlist{display:grid;gap:8px}
.eq{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.eq:first-child{border-top:0;padding-top:0}
.contact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.contact span{user-select:all;font-variant-numeric:tabular-nums}

/* Besoins */
.need-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.need-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.need-head strong{font-family:var(--f-display);font-size:1.15rem}
.need-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
.need-row .nb{flex:1;min-width:160px;display:grid;gap:2px}

/* Facturation */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.tile span{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.bclient{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bclient > button{appearance:none;border:0;background:transparent;width:100%;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;cursor:pointer;color:inherit}
.bclient .bt{display:grid;gap:2px;min-width:0}
.bclient .bt strong{font-size:1.05rem}
.bclient .bsum{font-family:var(--f-display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
.bdetail{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:10px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav strong{font-family:var(--f-display);font-size:1.35rem;min-width:9ch;text-align:center;text-transform:capitalize}

/* Formulaires */
.form{display:grid;gap:22px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px;min-width:0}
legend{font-family:var(--f-display);font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:0;margin-bottom:8px}
.f{display:grid;gap:5px;font-weight:500;min-width:0}
.f > span{font-size:.9rem}
.f small,.hint{color:var(--muted);font-weight:400;font-size:.82rem}
input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{width:100%;min-width:0;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-size:16px}
textarea{resize:vertical;min-height:72px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg label{display:grid;place-items:center;min-height:40px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem;text-align:center;padding:0 6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick label{position:relative}
.daypick input{position:absolute;opacity:0}
.daypick span{display:grid;place-items:center;min-width:48px;height:40px;border-radius:9px;border:1px solid var(--line);font-weight:600;cursor:pointer}
.daypick input:checked + span{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.daypick input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mfield{display:grid;gap:4px;min-width:0}
.mfield .ml{font-weight:600;font-size:.95rem}
.mfield .ml small{color:var(--muted);font-weight:500}
.mfield .mi{position:relative;display:block}
.mfield .mi input{font-family:var(--f-display);font-size:1.45rem;font-weight:700;padding-right:34px;font-variant-numeric:tabular-nums}
.mfield .mi .sw{position:absolute;right:12px;top:50%;width:16px;height:16px;transform:translateY(-50%)}
.mfield .mh{font-size:.76rem;color:var(--muted)}
.mfield.s-ok input{border-color:var(--ok);background:var(--ok-soft)}
.mfield.s-warn input{border-color:var(--warn);background:var(--warn-soft)}
.mfield.s-bad input{border-color:var(--bad);background:var(--bad-soft)}
.mfield.missing input,.f.missing input,.f.missing select{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.alerts{display:grid;gap:6px}
.alert{border-radius:9px;padding:8px 11px;font-size:.9rem}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.sugg{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sugg .sq{display:grid;gap:2px;min-width:0}
.sugg .sq b{font-family:var(--f-display);font-size:1.25rem}

function openBackup() {

      <div class="callout info"><b>Tes données ne sont que sur ce téléphone.</b><p>Si l’appli est supprimée ou si iOS efface ses données, seule une sauvegarde te permet de tout récupérer. Range le fichier dans Fichiers, sur iCloud Drive.</p></div>

        if (withPhotos) for (const id of await LocalDB.blobKeys()) { const bl = await LocalDB.getBlob(id); if (bl) blobs[id] = { type: bl.type || 'image/jpeg', b64: await blobToB64(bl) }; }

/* ---------- Démarrage ---------- */
async function boot() {
  applyHash();
  render();
  try { await LocalDB.init(); } catch { S.error = 'nodb'; render(); return; }
  db = LocalDB; assets = assetsLocal; downloads = downloadsLocal;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(p => { S.persisted = p; }); } catch { }
  try { if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(est => { S.usage = est.usage; schedule(); }); } catch { }
  try { await seedIfEmpty(); } catch { }
  const keys = ['pools', 'products', 'settings', 'stops', 'visits', 'needs', 'lines', 'invoiced'];
  const seen = new Set(), confirmed = new Set();
  const timer = setTimeout(() => { if (!S.synced) { S.slow = true; schedule(); } }, 10000);
  const mark = (k, meta) => {
    seen.add(k); if (!meta || !meta.fromCache) confirmed.add(k);
    S.ready = seen.size === keys.length;
    if (confirmed.size === keys.length) { S.synced = true; S.slow = false; clearTimeout(timer); }
    schedule();
  };
  const fail = e => { S.error = (e && e.code) || 'unavailable'; clearTimeout(timer); schedule(); };
  const col = (k, q) => q.onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { o[d.id] = { id: d.id, ...d.data() }; }); S[k] = o; mark(k, snap.metadata); }, fail);
  col('pools', db.collection('pools'));
  col('products', db.collection('products'));
  col('stops', db.collection('stops').where('date', '>=', STOPS_FROM));
  col('visits', db.collection('visits').where('date', '>=', VISITS_FROM));
  col('needs', db.collection('needs'));
  col('lines', db.collection('lines').where('month', '>=', LINES_FROM));
  col('invoiced', db.collection('invoiced'));
  db.doc('settings/main').onSnapshot(d => { S.settingsDoc = d.exists ? d.data() : null; mark('settings', d.metadata); }, fail);
}

WIDE.addEventListener('change', () => schedule());

/* ---------- Pastilles de mesures ---------- */

    if (val == null) return '';
    const s = L.status(val, th[k]) || '';

  };

/* ========== PLANNING ========== */
function scheduleFor(date) {
  const st = settings(), list = dayStops(date);
  const sch = L.schedule(list.map(s => { const p = S.pools[s.poolId]; return { id: s.id, gps: p && p.gps || null, duration: s.duration || (p && p.duration) || 40 }; }), st, date);
  return { list, sch };
}
function mapsUrl(list) {
  const st = settings();
  const pts = list.map(s => S.pools[s.poolId]).filter(Boolean).map(p => p.gps ? `${p.gps.lat},${p.gps.lng}` : p.address).filter(Boolean);
  if (!pts.length) return '';
  const origin = st.startGps ? `${st.startGps.lat},${st.startGps.lng}` : (st.startAddress || '');
  let u = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(pts[pts.length - 1]);
  if (origin) u += '&origin=' + encodeURIComponent(origin);
  if (pts.length > 1) u += '&waypoints=' + encodeURIComponent(pts.slice(0, -1).join('|'));

}

    <div class="weeknav"><button class="icon-btn" data-action="week" data-delta="-7" aria-label="Semaine précédente">${ICON.left}</button>
      <div class="weektitle"><strong>Semaine ${L.isoWeek(UI.week)}</strong><span>${range}</span></div>
      <button class="icon-btn" data-action="week" data-delta="7" aria-label="Semaine suivante">${ICON.right}</button></div>
    <div class="weekactions">${days.includes(t) ? '' : '<button class="btn ghost sm" data-action="week-today">Cette semaine</button>'}<button class="btn sm primary" data-action="fill-week">Remplir la semaine</button></div>
  </div>`;
  if (days.includes(t)) {
    const seen = new Set();
    const rem = dayStops(t).filter(s => s.status !== 'fait').map(s => S.pools[s.poolId]).filter(p => p && p.pendingNote && p.pendingNote.text && !seen.has(p.id) && seen.add(p.id));
    if (rem.length) h += `<section class="reminders"><h3>Rappels du jour</h3><ul>${rem.map(p => `<li><strong>${esc(p.name)} :</strong> ${esc(p.pendingNote.text)}</li>`).join('')}</ul></section>`;
  }
  if (!pools().length) {
    h += `<div class="empty-state"><h2>Ton planning est vide</h2><p>Si tu as un fichier de sauvegarde, restaure-le pour retrouver tes fiches. Sinon, crée tes fiches piscines avec leur fréquence et leurs jours préférés : « Remplir la semaine » placera chaque client, et tu ajusteras en glissant les cartes.</p><div class="row-actions"><button class="btn primary" data-action="backup">Restaurer une sauvegarde</button><button class="btn" data-action="new-pool">Créer une fiche piscine</button></div></div>`;

  }
  { const d = daysSince(st.lastBackup); if (d == null || d > 14) h += `<div class="callout"><b>Dernière sauvegarde : ${backupAge()}</b><p>Tes données ne sont que sur ce téléphone. Fais une sauvegarde au moins toutes les deux semaines.</p><button class="btn sm" data-action="backup" style="justify-self:start">Sauvegarder maintenant</button></div>`; }
  if (!st.startGps) h += `<div class="callout info">Renseigne ton point de départ (coordonnées GPS) dans Réglages pour obtenir les temps de trajet et l’heure d’arrivée à chaque piscine.</div>`;

  } else {
    h += `<div class="daystrip">${days.map(d => { const n = dayStops(d).length; return `<button class="daychip ${d === UI.day ? 'sel' : ''} ${d === t ? 'today' : ''}" data-action="pick-day" data-date="${d}" aria-label="${dayLabel(d, true)}, ${n} passage${n > 1 ? 's' : ''}"><span>${DOW[L.dow(d)]}</span><b>${L.parse(d).getDate()}</b><i>${n || ''}</i></button>`; }).join('')}</div>`;

function dayBlock(date, compact) {
  const { list, sch } = scheduleFor(date);
  const done = list.filter(s => s.status === 'fait').length;
  const maps = list.length ? mapsUrl(list) : '';
  const stats = list.length
    ? `${list.length} passage${list.length > 1 ? 's' : ''}${done ? ` · ${done} fait${done > 1 ? 's' : ''}` : ''}${sch.km > 0 ? ` · ${dur(sch.drive)} de route · ${nf(sch.km, 0)} km` : ''} · fin ≈ ${hm(sch.endHome)}${sch.unknown ? ` · <span style="color:var(--warn)">${sch.unknown} sans GPS</span>` : ''}`
    : 'Aucun passage';
  let prev = settings().startGps || null;
  const rows = list.map((s, i) => { const p = S.pools[s.poolId]; const out = stopCard(s, sch.rows[i], prev); if (p && p.gps) prev = p.gps; return out; }).join('');
  return `<section class="day">
    <header class="dayhead"><div><h3>${compact ? dayLabel(date, false) : dayLabel(date, true)}${date === today() ? ' <span class="tag">Aujourd’hui</span>' : ''}</h3><p>${stats}</p></div>

  const showNote = ns && ns.id === s.id;
  const plans = p ? plansUrl(prev, p.gps, p.address) : '';

  if (row && row.travel != null) conn = `<div class="conn">${ICON.car}<a href="${esc(plans)}" target="_blank" rel="noopener"><span>≈ ${dur(row.travel)} · ${nf(row.km, 1)} km</span><span class="lk">Plans</span></a></div>`;
  else if (p && !p.gps) conn = `<div class="conn" style="color:var(--warn)">${ICON.car}<span>trajet inconnu : pas de GPS sur la fiche</span>${plans ? `<a href="${esc(plans)}" target="_blank" rel="noopener"><span class="lk">Plans</span></a>` : ''}</div>`;
  const sub = [town(p && p.address), p && p.volume ? nf(p.volume, 0) + ' m³' : '', p ? TRT_SHORT[p.treatment] : '', row ? dur(row.duration) : ''].filter(Boolean).join(' · ');
  return conn + `<article class="stop ${done ? 'done' : ''} ${s.priority && !done ? 'prio' : ''}" data-id="${s.id}" data-date="${s.date}">
    <button class="handle" aria-label="Glisser pour déplacer ${esc(name)}">${ICON.grip}</button>
    <button class="stop-main" data-action="stop" data-id="${s.id}">
      <span class="stop-top">${row && settings().startGps ? `<span class="eta">${hm(row.arrive)}</span>` : ''}<strong>${esc(name)}</strong></span>
      <span class="stop-sub">${esc(sub)}</span>
      ${(s.type === 'ponctuel' || (s.priority && !done) || done) ? `<span class="badges">${s.type === 'ponctuel' ? `<span class="badge">${esc(s.label || 'Ponctuel')}</span>` : ''}${s.priority && !done ? '<span class="badge prio">Prioritaire</span>' : ''}${done ? '<span class="badge ok">Fait</span>' : ''}</span>` : ''}
      ${showNote ? `<span class="note">À prévoir : ${esc(p.pendingNote.text)}</span>` : ''}
      ${v ? valueChips(v) : ''}
    </button>
  </article>`;
}

async function moveStop(id, date, index) {
  const s = S.stops[id]; if (!s) return;
  const list = dayStops(date).filter(x => x.id !== id);
  const at = Math.max(0, Math.min(index, list.length));
  list.splice(at, 0, s);
  const ops = [];
  list.forEach((x, i) => {
    if (x.id === id) { if (x.date !== date || x.order !== i) ops.push(upd('stops', id, { date, order: i })); }
    else if (x.order !== i) ops.push(upd('stops', x.id, { order: i }));
  });
  if (ops.length) await run(ops, date !== s.date ? `Déplacé au ${dayLabel(date, true)}` : null);
}
async function optimizeDay(date) {
  const st = settings(), list = dayStops(date);
  const fixed = [...list.filter(s => s.status === 'fait'), ...list.filter(s => s.status !== 'fait' && s.priority)];
  const free = list.filter(s => s.status !== 'fait' && !s.priority);
  const withGps = free.filter(s => S.pools[s.poolId] && S.pools[s.poolId].gps);
  const noGps = free.filter(s => !(S.pools[s.poolId] && S.pools[s.poolId].gps));
  const lastFixed = [...fixed].reverse().find(s => S.pools[s.poolId] && S.pools[s.poolId].gps);
  const start = lastFixed ? S.pools[lastFixed.poolId].gps : st.startGps;
  const order = L.bestOrder(withGps.map(s => ({ id: s.id, gps: S.pools[s.poolId].gps })), start, !!st.startGps);
  const final = [...fixed.map(s => s.id), ...order, ...noGps.map(s => s.id)];
  const ops = [];
  final.forEach((id, i) => { if (S.stops[id].order !== i) ops.push(upd('stops', id, { order: i })); });
  if (!ops.length) { toast('L’ordre actuel est déjà le plus court.'); return; }
  await run(ops, noGps.length ? `Ordre optimisé. ${noGps.length} piscine${noGps.length > 1 ? 's' : ''} sans GPS placée${noGps.length > 1 ? 's' : ''} en fin de journée.` : 'Ordre optimisé');
}
async function fillWeek() {
  const st = settings(), days = L.weekDays(UI.week);
  const plan = L.planWeek(UI.week, pools(), Object.values(S.stops), st, today());
  if (!plan.length) { toast('Rien à ajouter : chaque client a déjà ses passages sur les jours restants de la semaine.'); return; }
  const byDate = {};
  plan.forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });
  const ops = [], now = Date.now();
  for (const date of Object.keys(byDate)) {
    const existing = dayStops(date);
    let items = byDate[date];
    if (!existing.length) {
      const g = items.filter(s => S.pools[s.poolId].gps), ng = items.filter(s => !S.pools[s.poolId].gps);
      g.forEach((s, i) => { s._k = 'k' + i; });
      const ord = L.bestOrder(g.map(s => ({ id: s._k, gps: S.pools[s.poolId].gps })), st.startGps, !!st.startGps);
      items = [...ord.map(k => g.find(s => s._k === k)), ...ng];
    }
    const base = existing.length ? Math.max(...existing.map(s => s.order ?? 0)) + 1 : 0;
    items.forEach((s, i) => { delete s._k; ops.push(put('stops', uid(), { ...s, order: base + i, createdAt: now + i })); });
  }
  await run(ops, `${plan.length} passage${plan.length > 1 ? 's' : ''} ajouté${plan.length > 1 ? 's' : ''} à la semaine`);
}

document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'); if (!h || e.button > 0) return;
  const card = h.closest('.stop'); if (!card) return;
  e.preventDefault();
  const r = card.getBoundingClientRect();
  const ghost = card.cloneNode(true); ghost.classList.add('ghost-card'); ghost.classList.remove('dragging');
  Object.assign(ghost.style, { width: r.width + 'px', left: r.left + 'px', top: r.top + 'px' });
  document.body.appendChild(ghost);
  card.classList.add('dragging');
  drag = { id: card.dataset.id, ghost, card, dx: e.clientX - r.left, dy: e.clientY - r.top, target: null, raf: null, y: e.clientY };
  window.addEventListener('pointermove', onDragMove, { passive: false });
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragCancel);
});
function clearMarks() { $$('.drop,.drop-before,.drop-after').forEach(el => el.classList.remove('drop', 'drop-before', 'drop-after')); }
function onDragMove(e) {
  if (!drag) return;
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  drag.y = e.clientY;
  clearMarks();
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const chip = el && el.closest('.daychip');
  const card = el && el.closest('.stop:not(.dragging)');
  const list = el && el.closest('.daylist');
  drag.target = null;
  if (chip) { chip.classList.add('drop'); drag.target = { date: chip.dataset.date, index: Infinity }; }
  else if (card && card.dataset.date) {
    const rr = card.getBoundingClientRect(), after = e.clientY > rr.top + rr.height / 2;
    card.classList.add(after ? 'drop-after' : 'drop-before');
    const ids = dayStops(card.dataset.date).filter(s => s.id !== drag.id).map(s => s.id);
    drag.target = { date: card.dataset.date, index: ids.indexOf(card.dataset.id) + (after ? 1 : 0) };
  } else if (list) { list.classList.add('drop'); drag.target = { date: list.dataset.date, index: Infinity }; }
  if (!drag.raf) {
    const tick = () => { if (!drag) return; const y = drag.y; if (y < 110) window.scrollBy(0, -10); else if (y > window.innerHeight - 130) window.scrollBy(0, 10); drag.raf = requestAnimationFrame(tick); };
    drag.raf = requestAnimationFrame(tick);
  }
}
function endDrag() {
  window.removeEventListener('pointermove', onDragMove); window.removeEventListener('pointerup', onDragEnd); window.removeEventListener('pointercancel', onDragCancel);
  if (!drag) return null;
  cancelAnimationFrame(drag.raf); drag.ghost.remove(); drag.card.classList.remove('dragging'); clearMarks();
  const d = drag; drag = null; return d;
}
function onDragEnd() { const d = endDrag(); if (d && d.target) moveStop(d.id, d.target.date, d.target.index); else schedule(); }
function onDragCancel() { endDrag(); schedule(); }

function analyze(vals, p, hist, st) {
  const th = st.th, alerts = [], sugg = [];
  const V = +p.volume || null;
  if (vals.ph != null) {
    if (vals.ph > th.ph.max) sugg.push({ kind: 'ph_minus', param: 'ph', current: vals.ph, target: th.ph.target });
    else if (vals.ph < th.ph.min) sugg.push({ kind: 'ph_plus', param: 'ph', current: vals.ph, target: th.ph.target });
  }
  if (vals.tac != null) {
    if (vals.tac < th.tac.min) sugg.push({ kind: 'tac_plus', param: 'tac', current: vals.tac, target: th.tac.target });
    else if (vals.tac > th.tac.max) alerts.push({ level: 'warn', text: `TAC élevé (${nf(vals.tac, 0)} ppm) : il tire le pH vers le haut en permanence. Baisse-le progressivement avec du pH moins.` });
  }
  if (vals.cya != null) {
    if (vals.cya > th.cya.alertMax) {
      const pct = L.drainPct(vals.cya, th.cya.target);
      alerts.push({ level: 'bad', text: `Stabilisant à ${nf(vals.cya, 0)} ppm : le chlore est bloqué. Vidange partielle d’environ ${nf(pct * 100, 0)} %${V ? ` (≈ ${nf(pct * V, 0)} m³)` : ''} pour revenir à ${th.cya.target} ppm.` });
    } else if (vals.cya > th.cya.max) alerts.push({ level: 'warn', text: `Stabilisant à ${nf(vals.cya, 0)} ppm : il faut plus de chlore libre pour la même efficacité.${p.treatment === 'galets' ? ' Les galets continuent d’en ajouter.' : ''}` });
    else if (vals.cya < th.cya.min && p.treatment !== 'galets') sugg.push({ kind: 'stab', param: 'cya', current: vals.cya, target: th.cya.target });
  }
  if (vals.cl != null && vals.cya != null && vals.cya > 0) {
    const minFc = 0.075 * vals.cya;
    if (vals.cl < minFc) alerts.push({ level: 'bad', text: `Avec ${nf(vals.cya, 0)} ppm de stabilisant, il faut au moins ${nf(minFc, 1)} ppm de chlore libre (7,5 % du stabilisant) pour que la désinfection tienne.` });
  }
  if (vals.cl != null && vals.cl < th.cl.alertMin) sugg.push({ kind: 'choc', current: vals.cl });
  if (p.treatment === 'electrolyseur') {
    if (vals.prod != null && vals.cl != null && vals.cl < th.cl.min && (p.elecUnit || '%') === '%' && vals.prod >= 90) alerts.push({ level: 'warn', text: 'Électrolyseur presque au maximum avec un chlore bas : contrôle l’entartrage de la cellule et le taux de sel.' });
    if (vals.sel != null && vals.sel < th.sel.min) sugg.push({ kind: 'sel', param: 'sel', current: vals.sel, target: th.sel.target });
  }
  if (p.treatment === 'liquide' && vals.redox != null && vals.cl != null && L.status(vals.redox, th.redox) === 'ok' && vals.cl < th.cl.min) alerts.push({ level: 'warn', text: 'Redox dans la plage mais chlore libre bas : vérifie l’étalonnage de la sonde redox et le pH (un pH haut fait chuter le redox réel).' });
  const series = [...hist.map(h => ({ ph: h.ph, cl: h.cl, cya: h.cya })), { ph: vals.ph, cl: vals.cl, cya: vals.cya }];
  alerts.push(...L.trends(series, th, p.treatment));
  const out = sugg.map(sg => {
    const prod = productOfKind(sg.kind);
    if (!prod) return { ...sg, missing: true };
    let q = null, how = '';
    if (prod.calc === 'fixe') { q = L.doseFixed(+prod.dose, V); how = `${nf(prod.dose, 1)} ${prod.doseUnit || 'g'}/m³ × ${nf(V, 0)} m³ (traitement choc)`; }
    else if (prod.calc === 'step') {
      q = L.doseStep(+prod.dose, +prod.step, sg.current, sg.target, V);
      const pl = PARAMS[sg.param];
      how = `${pl.label} ${nf(sg.current, pl.d)} → ${nf(sg.target, pl.d)} sur ${nf(V, 0)} m³`;
    }
    return { ...sg, prod, q, how, pk: L.packsFor(prod, q) };
  });
  return { alerts, sugg: out };
}
async function stampPhoto(file, label) {
  let src = null, w, h, objUrl = null;
  try { src = await createImageBitmap(file); w = src.width; h = src.height; }
  catch {
    objUrl = URL.createObjectURL(file);
    src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = objUrl; });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const sc = Math.min(1, 1600 / Math.max(w, h)), cw = Math.round(w * sc), ch = Math.round(h * sc);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0, cw, ch);
  if (objUrl) URL.revokeObjectURL(objUrl);
  const when = new Date(file.lastModified || Date.now());
  const txt = `${label} · ${when.toLocaleDateString('fr-FR')} ${when.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
  const fs = Math.max(16, Math.round(cw / 38)), pd = Math.round(fs * 0.55);
  x.font = `600 ${fs}px Barlow, system-ui, sans-serif`;
  const tw = x.measureText(txt).width;
  x.fillStyle = 'rgba(0,0,0,.58)'; x.fillRect(0, ch - fs - pd * 2, Math.min(cw, tw + pd * 2), fs + pd * 2);
  x.fillStyle = '#ffffff'; x.textBaseline = 'middle'; x.fillText(txt, pd, ch - pd - fs / 2);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  return { blob, at: when.toISOString() };
}

    <fieldset><legend>Constantes <small class="hint" id="const-opt" ${state.type === 'ponctuel' ? '' : 'hidden'}>(facultatives en ponctuel)</small></legend>
      <div class="mgrid">${mField('cl', 'Chlore libre', 'ppm', 'pastille DPD 1')}${mField('ph', 'pH', '', 'rouge de phénol')}${mField('tac', 'TAC', 'ppm', 'bandelette')}${mField('cya', 'Stabilisant', 'ppm', 'bandelette')}</div>
    </fieldset>
    <fieldset><legend>${TRAITEMENT[tr]}</legend>
      <div class="mgrid">
      ${tr === 'electrolyseur' ? mField('prod', 'Production', p.elecUnit || '%', 'lue sur le boîtier') + mField('sel', 'Sel', 'g/L', 'facultatif') : ''}
      ${tr === 'liquide' ? mField('redox', 'Redox', 'mV', 'lu sur le régulateur') : ''}
      ${tr === 'galets' ? mField('galets', 'Galets ajoutés', 'nb', 'dans le skimmer ou le diffuseur') : ''}
      </div>
    </fieldset>
    <div id="analysis" class="alerts"></div>
    <fieldset><legend>Produits utilisés</legend><p class="hint">La quantité utilisée sert à l’historique. Ne facture des conditionnements que s’ils sortent de ton stock : un produit acheté via Besoins est déjà facturé.</p><div id="prodrows"></div><button type="button" class="btn ghost sm" data-v="add-prod" style="justify-self:start">+ Ajouter un produit</button></fieldset>
    <fieldset><legend>Photo du bassin <small class="hint" id="photo-opt">${state.type === 'ponctuel' ? '(facultative)' : '(obligatoire)'}</small></legend>
      ${assets ? `<input type="file" accept="image/*" capture="environment" id="vphoto" hidden><div class="photo-prev" id="photoprev"></div><button type="button" class="btn" data-v="photo" style="justify-self:start">${ICON.cam} Prendre la photo</button>` : `<p class="hint">L’envoi de photos n’est pas disponible dans cette vue.</p>`}
    </fieldset>
    <label class="f"><span>Remarques</span><textarea name="remarks" rows="3" placeholder="État du bassin, du local technique, observations…"></textarea></label>
    <label class="f"><span>Besoins pour le prochain passage</span><textarea name="nextNote" rows="2" placeholder="Ex. : apporter une poche filtrante, contrôler la cellule"></textarea><small>S’affiche sur le prochain passage de ${esc(p.name)} et dans les rappels du jour.</small></label>
    <fieldset><legend>Besoins produits</legend><div id="needrows"></div><button type="button" class="btn ghost sm" data-v="add-need" style="justify-self:start">+ Ajouter un besoin produit</button></fieldset>
    <fieldset><legend>Facturation</legend>
      <div class="grid2"><label class="f" data-req="price"><span>Prix du passage <small>(${priceLabel()})</small></span><input name="price" inputmode="decimal" value="${esc(p.price ?? '')}"></label>
      <label class="f"><span>Date du passage</span><input type="date" name="date" value="${vDate}"></label></div>
    </fieldset>
    <div id="verr" class="errors" hidden></div>
  </form>`;
  const el = openSheet({ title: p.name, html, foot: `<button class="btn primary" data-v="save">Valider le passage</button>` });
  const f = $('#vform', el);
  const readVals = () => { const g = n => f.elements[n] ? L.num(f.elements[n].value) : null; return { cl: g('cl'), ph: g('ph'), tac: g('tac'), cya: g('cya'), prod: g('prod'), sel: g('sel'), redox: g('redox'), galets: g('galets') }; };
  const paint = vals => {
    ['cl', 'ph', 'tac', 'cya', 'sel', 'redox'].forEach(k => {
      const lab = f.querySelector(`.mfield[data-param="${k}"]`); if (!lab) return;
      lab.classList.remove('s-ok', 's-warn', 's-bad'); const sv = L.status(vals[k], st.th[k]); if (sv) lab.classList.add('s-' + sv);
      const sw = lab.querySelector('.sw'); const col = k === 'ph' ? swatch(PH_SCALE, vals.ph) : k === 'cl' ? swatch(DPD_SCALE, vals.cl) : null;
      sw.hidden = !col; if (col) sw.style.background = col;
    });
  };
  const renderAnalysis = () => {
    const vals = readVals(); paint(vals);
    const a = analyze(vals, p, hist, st); state.sugg = a.sugg;
    const box = $('#analysis', el);
    let h = a.alerts.map(x => `<div class="alert ${x.level}">${x.text}</div>`).join('');
    if (a.sugg.length) h += `<h3 style="margin-top:4px">Corrections suggérées</h3>` + a.sugg.map((sg, i) => sg.missing
      ? `<div class="sugg"><div class="sq"><span>Ajoute un produit « ${PKIND[sg.kind]} » dans Réglages pour obtenir la dose.</span></div></div>`
      : `<div class="sugg"><div class="sq"><span>${esc(sg.prod.name)}</span><b>${sg.q != null ? L.fmtQty(sg.q, sg.prod.doseUnit || 'g') : 'Volume manquant'}</b><small class="hint">${esc(sg.how)}${sg.pk && sg.pk.packs ? ` · soit ${esc(packPlural(sg.pk.packs, sg.prod))}` : ''}</small></div><div class="row-actions"><button type="button" class="btn sm" data-v="sugg-use" data-i="${i}">Utilisé</button><button type="button" class="btn sm ghost" data-v="sugg-need" data-i="${i}">À acheter</button></div></div>`).join('');
    box.innerHTML = h;
  };
  const renderRows = () => { $('#prodrows', el).innerHTML = rowsHtml(state.products, 'prod'); $('#needrows', el).innerHTML = rowsHtml(state.needs, 'need'); };
  const setType = t => {
    state.type = t; $('#ponct-box', el).hidden = t !== 'ponctuel'; $('#const-opt', el).hidden = t !== 'ponctuel';
    $('#photo-opt', el).textContent = t === 'ponctuel' ? '(facultative)' : '(obligatoire)';
  };
  renderRows(); renderAnalysis();
  el.addEventListener('input', e => {
    const row = e.target.closest('.prow');
    if (row) {
      const list = row.dataset.kind === 'prod' ? state.products : state.needs, r = list[+row.dataset.i], k = e.target.dataset.f;
      if (!k) return;
      r[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
      if (k === 'productId') renderRows();
      return;
    }
    if (e.target.name === 'type') { setType(e.target.value); return; }
    if (e.target.closest('.mfield')) { e.target.closest('.mfield').classList.remove('missing'); renderAnalysis(); }
    const fr = e.target.closest('.f'); if (fr) fr.classList.remove('missing');
  });
  if (assets) $('#vphoto', el).addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const prev = $('#photoprev', el); state.uploading = true; prev.innerHTML = '<p class="hint">Préparation et envoi de la photo…</p>';
    try {
      const { blob, at } = await stampPhoto(file, p.name);
      const r = await assets.upload(blob, { type: 'image/jpeg' });
      state.photo = { id: r.id, at };
      prev.innerHTML = `<img src="${esc(r.url)}" alt="Photo du passage"><small class="hint">Horodatée le ${new Date(at).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</small>`;
    } catch (err) {
      prev.innerHTML = `<p class="errors">Photo non envoyée (${esc(err && (err.code || err.message) || 'erreur')}). Réessaie.</p>`;
    } finally { state.uploading = false; e.target.value = ''; }
  });
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const a = b.dataset.v;
    if (a === 'photo') $('#vphoto', el).click();
    else if (a === 'add-prod') { state.products.push({ productId: '', used: '', packs: 0 }); renderRows(); }
    else if (a === 'add-need') { state.needs.push({ productId: '', packs: 1, note: '' }); renderRows(); }
    else if (a === 'row-del') { const row = b.closest('.prow'); (row.dataset.kind === 'prod' ? state.products : state.needs).splice(+row.dataset.i, 1); renderRows(); }
    else if (a === 'sugg-use' || a === 'sugg-need') {
      const sg = state.sugg[+b.dataset.i]; if (!sg || !sg.prod) return;
      if (a === 'sugg-use') { state.products.push({ productId: sg.prod.id, used: sg.pk ? sg.pk.qty : '', packs: 0 }); toast('Ajouté aux produits utilisés'); }
      else { state.needs.push({ productId: sg.prod.id, packs: (sg.pk && sg.pk.packs) || 1, note: sg.q != null ? `Dose calculée : ${L.fmtQty(sg.q, sg.prod.doseUnit || 'g')}` : '' }); toast('Ajouté aux besoins produits'); }
      renderRows();
    }
    else if (a === 'save') saveVisit();
  });
  async function saveVisit() {
    if (state.uploading) { toast('Attends la fin de l’envoi de la photo.', true); return; }
    const vals = readVals(), errs = [], ent = state.type === 'entretien';
    $$('.missing', f).forEach(x => x.classList.remove('missing'));
    const req = (k, label) => { if (vals[k] == null) { errs.push(label); const m = f.querySelector(`.mfield[data-param="${k}"]`); if (m) m.classList.add('missing'); } };
    if (ent) {
      req('cl', 'chlore libre'); req('ph', 'pH'); req('tac', 'TAC'); req('cya', 'stabilisant');
      if (tr === 'electrolyseur') req('prod', 'production de l’électrolyseur');
      if (tr === 'liquide') req('redox', 'redox');
      if (tr === 'galets') req('galets', 'nombre de galets');
      if (assets && !state.photo) errs.push('photo du bassin');
    }
    const price = L.num(f.elements.price.value);
    if (price == null) { errs.push('prix du passage'); f.querySelector('[data-req="price"]').classList.add('missing'); }
    const ranges = { ph: [5, 9.5], cl: [0, 30], tac: [0, 600], cya: [0, 400], redox: [0, 1200], sel: [0, 15], galets: [0, 50] };
    Object.entries(ranges).forEach(([k, [lo, hi]]) => { if (vals[k] != null && (vals[k] < lo || vals[k] > hi)) errs.push(`${(PARAMS[k] || { label: 'galets' }).label} hors plage (${nf(vals[k], 2)})`); });
    if (tr === 'electrolyseur' && (p.elecUnit || '%') === '%' && vals.prod != null && (vals.prod < 0 || vals.prod > 100)) errs.push('production hors plage (0 à 100 %)');
    const prodLines = state.products.filter(r => r.productId && (L.num(r.used) != null || +r.packs > 0));
    prodLines.forEach(r => { const pr = S.products[r.productId]; if (+r.packs > 0 && (pr.price == null || pr.price === '')) errs.push(`prix du conditionnement de ${pr.name} (à renseigner dans Réglages)`); });
    const box = $('#verr', el);
    if (errs.length) { box.hidden = false; box.textContent = 'À compléter : ' + errs.join(', ') + '.'; box.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    box.hidden = true;
    const date = f.elements.date.value || vDate, month = L.ym(date), vid = uid(), now = new Date();
    const at = `${date}T${L.pad(now.getHours())}:${L.pad(now.getMinutes())}:00`;
    const label = ent ? 'Entretien' : (f.elements.label.value + (f.elements.labelMore.value.trim() ? ' – ' + f.elements.labelMore.value.trim() : ''));
    const visit = {
      poolId: p.id, stopId: s.id, date, at, type: state.type, label,
      cl: vals.cl, ph: vals.ph, tac: vals.tac, cya: vals.cya, sel: vals.sel, redox: vals.redox,
      treat: { kind: tr, value: tr === 'electrolyseur' ? vals.prod : tr === 'liquide' ? vals.redox : vals.galets, unit: tr === 'electrolyseur' ? (p.elecUnit || '%') : tr === 'liquide' ? 'mV' : 'galets' },
      photoId: state.photo ? state.photo.id : null, photoAt: state.photo ? state.photo.at : null,
      remarks: f.elements.remarks.value.trim(), nextNote: f.elements.nextNote.value.trim(), price,
      products: prodLines.map(r => { const pr = S.products[r.productId]; return { productId: r.productId, name: pr.name, used: L.num(r.used), usedUnit: pr.packUnit || '', packs: Math.round(+r.packs || 0), pack: packName(pr), price: +pr.price || 0 }; }),
      createdAt: Date.now()
    };
    const ops = [put('visits', vid, visit)];
    const line = (o, i) => ops.push(put('lines', vid + '-' + i, { poolId: p.id, month, date, source: 'visite', refId: vid, ...o }));
    let li = 0;
    line({ kind: ent ? 'passage' : 'ponctuel', label, qty: 1, unit: '', unitPrice: price }, li++);
    visit.products.filter(x => x.packs > 0).forEach(x => line({ kind: 'produit', label: x.name, qty: x.packs, unit: x.pack, unitPrice: x.price }, li++));
    state.needs.filter(r => r.productId).forEach(r => { const pr = S.products[r.productId]; ops.push(put('needs', uid(), { poolId: p.id, productId: r.productId, name: pr.name, qty: Math.max(1, Math.round(+r.packs || 1)), unit: packName(pr), note: (r.note || '').trim(), status: 'open', createdAt: Date.now() })); });
    ops.push(upd('stops', s.id, { status: 'fait', visitId: vid, date, type: state.type, label: ent ? null : label }));
    const old = p.pendingNote && p.pendingNote.text ? p.pendingNote : null;
    const keepOld = old && !(f.elements.noteDone && f.elements.noteDone.checked);
    const newNote = visit.nextNote ? { text: visit.nextNote, date, from: vid } : (keepOld ? old : null);
    if (JSON.stringify(newNote) !== JSON.stringify(old)) ops.push(upd('pools', p.id, { pendingNote: newNote }));
    const btn = el.querySelector('[data-v="save"]'); btn.disabled = true; btn.textContent = 'Enregistrement…';
    const ok = await run(ops, 'Passage validé');
    if (ok) closeSheet(); else { btn.disabled = false; btn.textContent = 'Valider le passage'; }
  }
}

function openVisit(id) {
  const v = S.visits[id]; if (!v) { toast('Passage introuvable (plus d’un an ?).', true); return; }
  const p = S.pools[v.poolId];
  const tr = v.treat || {};
  const el = openSheet({
    title: `${p ? p.name : 'Passage'} · ${dateFr(v.date)}`,
    html: `<div class="form vdetail">
      <p class="muted">${esc(v.label || 'Entretien')} · validé ${v.at ? 'à ' + v.at.slice(11, 16).replace(':', 'h') : ''}</p>
      ${valueChips(v)}
      ${tr.value != null ? `<p><b>${esc(TRAITEMENT[tr.kind] || '')}</b> : ${nf(tr.value, 1)} ${esc(tr.unit || '')}${v.sel != null ? ` · sel ${nf(v.sel, 1)} g/L` : ''}</p>` : ''}
      ${v.photoId ? `<img data-blob="${esc(v.photoId)}" src="${blobSrc(v.photoId)}" alt="Photo du passage">` : ''}
      ${v.products && v.products.length ? `<div><b>Produits utilisés</b><ul>${v.products.map(x => `<li>${esc(x.name)}${x.used != null ? ` : ${nf(x.used, 2)} ${esc(x.usedUnit || '')}` : (x.qty != null ? ` : ${nf(x.qty, 2)} ${esc(x.unit || '')}` : '')}${x.packs > 0 ? ` · facturé ${nf(x.packs, 0)} × ${esc(x.pack)} = ${eur(x.packs * x.price)}` : ''}</li>`).join('')}</ul></div>` : ''}
      ${v.remarks ? `<div><b>Remarques</b><p>${esc(v.remarks)}</p></div>` : ''}
      ${v.nextNote ? `<div><b>Pour le passage suivant</b><p>${esc(v.nextNote)}</p></div>` : ''}
      <p>Prix du passage : ${eur(v.price)}</p>
      <button class="btn ghost danger" data-v="delete" style="justify-self:start">Supprimer ce passage</button>
      <p class="hint">La suppression retire aussi ses lignes de facturation et remet le passage « à faire » dans le planning.</p>
    </div>`
  });
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-v="delete"]'); if (!b) return;
    if (!armed(b, 'Confirmer la suppression')) return;
    const ops = [del('visits', id)];
    Object.values(S.lines).filter(l => l.refId === id).forEach(l => ops.push(del('lines', l.id)));
    if (v.stopId && S.stops[v.stopId]) ops.push(upd('stops', v.stopId, { status: 'prevu', visitId: null }));
    closeSheet();
    const ok = await run(ops, 'Passage supprimé');
    if (ok && v.photoId && assets) assets.delete(v.photoId).catch(() => { });
  });
}

/* ========== PISCINES ========== */

  const eqWarn = (p.equipment || []).some(e => { const d = L.equipDue(e, st.equipLife[EQUIP[e.type] && EQUIP[e.type].life], L.ym(today())); return d && d.level !== 'ok'; });
  const f = L.freqFor(p, today());
  return `<button class="pcard" data-action="pool" data-id="${p.id}">
    ${p.photoId ? `<img data-blob="${esc(p.photoId)}" src="${blobSrc(p.photoId)}" alt="" loading="lazy">` : `<span class="pthumb">${ICON.drop}</span>`}
    <span class="pbody"><strong>${esc(p.name)}</strong>
      <span class="muted">${esc([town(p.address), p.volume ? nf(p.volume, 0) + ' m³' : '', TRT_SHORT[p.treatment], freqLabel(f)].filter(Boolean).join(' · '))}</span>
      <span class="muted sm">${last ? `Dernier passage : ${shortDate(last.date)}` : 'Aucun passage enregistré'}</span>
      ${last ? valueChips(last) : ''}
      <span class="badges">${p.incomplete || !p.volume ? '<span class="badge bad">Fiche à compléter</span>' : ''}${p.pendingNote && p.pendingNote.text ? '<span class="badge warn">Rappel en cours</span>' : ''}${eqWarn ? '<span class="badge warn">Matériel à prévoir</span>' : ''}${!p.gps ? '<span class="badge">Sans GPS</span>' : ''}</span>
    </span></button>`;
}
function poolListHtml() {

function viewPools() {

$('#view').addEventListener('input', e => { if (e.target.id === 'pool-search') { UI.search = e.target.value; $('#pool-list').innerHTML = poolListHtml(); } });

function spark(vals, t, label) {
  const v = vals.filter(x => x != null).slice(-12);
  if (v.length < 2) return '<p class="hint">Pas encore assez de mesures</p>';
  const W = 180, H = 46, P = 5;
  let lo = Math.min(...v, t.min), hi = Math.max(...v, t.max); if (hi - lo < 1e-6) { hi += 1; lo -= 1; }
  const y = x => H - P - (x - lo) / (hi - lo) * (H - 2 * P), xs = i => P + i * (W - 2 * P) / (v.length - 1);
  const pts = v.map((x, i) => `${xs(i).toFixed(1)},${y(x).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} sur les ${v.length} derniers passages"><rect class="sp-band" x="0" y="${y(t.max).toFixed(1)}" width="${W}" height="${Math.max(0, y(t.min) - y(t.max)).toFixed(1)}"/><polyline class="sp-line" points="${pts}"/><circle class="sp-dot" cx="${xs(v.length - 1).toFixed(1)}" cy="${y(v[v.length - 1]).toFixed(1)}" r="3.2"/></svg>`;
}
function viewPool(id) {
  const p = S.pools[id];
  if (!p) { UI.poolId = null; return viewPools(); }
  const st = settings(), hist = poolVisits(id), last = hist[hist.length - 1], nxt = nextStopOf(id), nowYm = L.ym(today());
  const navUrl = plansUrl(null, p.gps, p.address);
  const fact = (k, v) => `<div><dt>${k}</dt><dd>${v || '<span class="muted">–</span>'}</dd></div>`;
  const curM = +today().slice(5, 7);
  const fm = MONTHS_S.map((m, i) => L.freqFor(p, `2000-${L.pad(i + 1)}-15`));
  const monthGrid = `<div class="monthfreq">${MONTHS_S.map((m, i) => `<div class="${i + 1 === curM ? 'cur' : ''}"><span>${m}</span><b>${freqShort(fm[i])}</b></div>`).join('')}</div>`;
  const freqNotes = [fm.includes(0.25) ? `1 par mois : ${+p.monthWeek > 1 ? (+p.monthWeek) + 'e' : '1re'} semaine du mois` : '', fm.includes(0.5) ? `1 toutes les 2 semaines : semaines ${+p.parity ? 'impaires' : 'paires'}` : ''].filter(Boolean).join(' · ');
  const dims = p.dims && (p.dims.L || p.dims.l) ? `${nf(p.dims.L, 2)} × ${nf(p.dims.l, 2)} m, prof. moy. ${nf(p.dims.p, 2)} m` : '';
  const acc = p.access || {};
  const eq = (p.equipment || []).map(e => {
    const d = L.equipDue(e, st.equipLife[EQUIP[e.type] && EQUIP[e.type].life], nowYm);
    const badge = d ? `<span class="badge ${d.level === 'ok' ? 'ok' : d.level}">${d.level === 'bad' ? 'À remplacer' : d.level === 'warn' ? 'Bientôt' : 'OK'} · ${monthLabel(d.due)}</span>` : '';
    return `<div class="eq"><div><b>${esc(EQUIP[e.type] ? EQUIP[e.type].label : e.type)}</b>${e.model ? ` · ${esc(e.model)}` : ''}<br><span class="muted sm">${e.installed ? 'Posé en ' + monthLabel(String(e.installed).slice(0, 7)) : 'Date de pose inconnue'}</span></div>${badge}</div>`;
  }).join('');
  const mm = k => `<div class="measure"><span>${PARAMS[k].label}${PARAMS[k].unit ? ' (' + PARAMS[k].unit + ')' : ''}</span>${last && last[k] != null ? `<b class="num">${nf(last[k], PARAMS[k].d)}</b>` : '<b class="muted">–</b>'}${spark(hist.map(v => v[k]), st.th[k], PARAMS[k].label)}</div>`;
  const histRows = [...hist].reverse().slice(0, 40).map(v => `<button class="hrow" data-action="visit" data-id="${v.id}">${v.photoId ? `<img data-blob="${esc(v.photoId)}" src="${blobSrc(v.photoId)}" alt="" loading="lazy">` : ''}<span class="hb"><span><b>${dateFr(v.date)}</b> · ${esc(v.label || 'Entretien')}</span>${valueChips(v)}${v.remarks ? `<span class="muted sm">${esc(v.remarks.slice(0, 110))}</span>` : ''}</span></button>`).join('');
  return `<div class="fiche">
    <button class="btn ghost sm back" data-action="back-pools">${ICON.left} Toutes les piscines</button>

    ${p.pendingNote && p.pendingNote.text ? `<div class="callout"><b>À prévoir au prochain passage${nxt ? ` (${dayLabel(nxt.date, true)})` : ''}</b><p>${esc(p.pendingNote.text)}</p></div>` : ''}

        ${fact('Volume', p.volume ? nf(p.volume, 1) + ' m³' : '')}${fact('Dimensions', esc(dims))}${fact('Filtration', esc(FILTRATION[p.filtration]))}${fact('Couverture', esc(COUVERTURE[p.coverage]))}${fact('Traitement', esc(TRAITEMENT[p.treatment]) + (p.treatment === 'electrolyseur' ? ` (en ${esc(p.elecUnit || '%')})` : ''))}${fact('GPS', p.gps ? esc(gpsText(p.gps)) : '<span style="color:var(--warn)">non renseigné</span>')}

      </dl></section>
      <section class="card"><h2>Accès</h2><dl class="facts">
        ${fact('Code portail', esc(acc.gate))}${fact('Local technique', esc(acc.local))}${fact('Clés', esc(acc.keys))}${fact('Animaux', esc(acc.animals))}${fact('Contact sur place', esc(acc.contact))}
      </dl>
      ${p.phone || p.email ? `<div class="contact">${p.phone ? `<span>${esc(p.phone)}</span><button class="btn sm ghost" data-action="copy" data-text="${esc(p.phone)}">Copier le numéro</button>` : ''}${p.email ? `<span>${esc(p.email)}</span><button class="btn sm ghost" data-action="copy" data-text="${esc(p.email)}">Copier l’e-mail</button>` : ''}</div>` : ''}
      </section>
      <section class="card"><h2>Matériel</h2>${eq ? `<div class="eqlist">${eq}</div>` : '<p class="muted">Aucun matériel renseigné. Ajoute la pompe, le filtre et la cellule dans « Modifier » pour être prévenu des remplacements.</p>'}</section>
    </div>
    <section class="card"><h2>Dernières mesures</h2>${hist.length ? `<div class="measures">${mm('ph')}${mm('cl')}${mm('tac')}${mm('cya')}</div><p class="hint">La bande verte correspond à la plage idéale réglée dans Réglages.</p>` : '<p class="muted">Aucune mesure pour l’instant.</p>'}</section>
    ${p.notes ? `<section class="card"><h2>Notes</h2><p style="white-space:pre-line">${esc(p.notes)}</p></section>` : ''}
    <section class="card"><h2>Historique des passages</h2>${histRows ? `<div class="hlist">${histRows}</div>` : '<p class="muted">Aucun passage sur les 12 derniers mois.</p>'}</section>
    <button class="btn ghost danger" data-action="archive-pool" data-id="${id}" style="justify-self:start">Archiver la fiche</button>
  </div>`;
}

    catch (err) { prev.innerHTML = `<p class="errors">Photo non envoyée (${esc(err && (err.code || err.message) || 'erreur')}).</p>`; }

    const a = b.dataset.v;
    if (a === 'calc-vol') {
      const Lg = L.num(f.elements.dL.value), lg = L.num(f.elements.dl.value), pr = L.num(f.elements.dp.value);
      if (Lg && lg && pr) { f.elements.volume.value = String(L.round(Lg * lg * pr, 1)).replace('.', ','); toast(`Volume : ${nf(Lg * lg * pr, 1)} m³`); }
      else toast('Renseigne longueur, largeur et profondeur moyenne.', true);
    } else if (a === 'eq-add') { state.equipment.push({ type: 'sable', model: '', installed: '', life: '' }); $('#eqrows', el).innerHTML = eqHtml(); }
    else if (a === 'eq-del') { state.equipment.splice(+b.closest('.prow').dataset.i, 1); $('#eqrows', el).innerHTML = eqHtml(); }
    else if (a === 'photo') $('#pphoto', el).click();
    else if (a === 'save') {
      if (state.uploading) { toast('Attends la fin de l’envoi de la photo.', true); return; }
      const errs = [], v = n => f.elements[n].value.trim();
      const name = v('name'), volume = L.num(v('volume')), gpsRaw = v('gps'), gps = L.parseGps(gpsRaw);

      const box = $('#perr', el);
      if (errs.length) { box.hidden = false; box.textContent = 'À corriger : ' + errs.join(', ') + '.'; box.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      const doc = {
        ...(id ? clone(S.pools[id]) : { createdAt: Date.now() }), active: true,
        name, phone: v('phone'), email: v('email'), address: v('address'), gps: gps || null,
        dims: { L: L.num(v('dL')), l: L.num(v('dl')), p: L.num(v('dp')) }, volume,
        filtration: v('filtration'), coverage: v('coverage'), treatment: v('treatment'), elecUnit: v('elecUnit'),
        freqByMonth: Array.from({ length: 12 }, (_, i) => +f.elements['fm' + i].value), monthWeek: +v('monthWeek') || 1, parity: +v('parity'),
        prefDays: $$('[name="prefDays"]:checked', f).map(i => +i.value),
        duration: L.num(v('duration')) || 40, price: L.num(v('price')),
        access: { gate: v('gate'), local: v('local'), keys: v('keys'), animals: v('animals'), contact: v('contact') },
        equipment: state.equipment.map(e => ({ type: e.type, model: (e.model || '').trim(), installed: e.installed || '', life: L.num(e.life) })),
        photoId: state.photoId, notes: v('notes')
      };
      delete doc.id; delete doc.freqSeason; delete doc.freqOff; delete doc.incomplete;
      const pid = id || uid();
      const rs = $('#freq-reset', el), reset = rs && !rs.hidden && f.elements.freqReset.checked;
      const ops = [put('pools', pid, doc), ...(reset ? futureStops.map(s => del('stops', s.id)) : [])];
      const ok = await run(ops, reset ? `Fiche enregistrée, ${futureStops.length} passage${futureStops.length > 1 ? 's' : ''} retiré${futureStops.length > 1 ? 's' : ''} du planning` : (id ? 'Fiche enregistrée' : 'Fiche créée'));
      if (ok) { closeSheet(); UI.poolId = pid; setTab('piscines'); }
    }
  });
}

function openCalc(poolId) {
  const p = S.pools[poolId]; if (!p) return;
  const st = settings(), hist = poolVisits(poolId), last = hist[hist.length - 1] || {};
  const list = products().filter(x => x.calc === 'step' || x.calc === 'fixe');
  if (!list.length) { toast('Aucun produit calculable : ajoute-en dans Réglages.', true); return; }
  const el = openSheet({
    title: `Calculatrice · ${p.name}`,
    html: `<form class="form" id="cform" novalidate>
      <label class="f"><span>Produit</span><select name="prod">${list.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>
      <div class="grid2"><label class="f"><span>Volume du bassin (m³)</span><input name="vol" inputmode="decimal" value="${esc(p.volume ?? '')}"></label><label class="f" id="c-dose"><span id="c-dose-l">Dose</span><input name="dose" inputmode="decimal"><small id="c-dose-h">Dose de l’étiquette. Modifie-la si tu changes de produit.</small></label></div>
      <div class="grid2" id="c-step"><label class="f"><span id="c-cur-l">Valeur mesurée</span><input name="cur" inputmode="decimal"></label><label class="f"><span>Valeur cible</span><input name="tgt" inputmode="decimal"></label></div>
      <div class="result" id="c-res" aria-live="polite"></div>
      <div class="row-actions"><button type="button" class="btn" data-v="need">Ajouter aux besoins produits</button><button type="button" class="btn ghost" data-v="save-dose">Enregistrer cette dose pour le produit</button></div>
      <fieldset><legend>Vidange partielle (stabilisant)</legend>
        <div class="grid2"><label class="f"><span>Stabilisant mesuré (ppm)</span><input name="cyaCur" inputmode="decimal" value="${esc(last.cya ?? '')}"></label><label class="f"><span>Stabilisant visé (ppm)</span><input name="cyaTgt" inputmode="decimal" value="${st.th.cya.target}"></label></div>
        <div class="result" id="c-drain"></div>
        <p class="hint">Le stabilisant ne s’évapore pas et aucun produit ne le retire : seule l’eau neuve le dilue. Pourcentage à vider = 1 − visé ÷ mesuré.</p>
      </fieldset>
    </form>`
  });
  const f = $('#cform', el);
  let cur = null;
  const loadProd = () => {
    cur = S.products[f.elements.prod.value];
    const param = PARAM_OF[cur.kind];
    f.elements.dose.value = String(cur.dose ?? '').replace('.', ',');
    const du = cur.doseUnit || 'g';
    $('#c-dose-l', el).textContent = cur.calc === 'fixe' ? `Dose (${du}/m³)` : `Dose (${du}/m³ pour ${nf(cur.step, 2)} ${param ? STEP_LABEL[param] : 'unité'})`;
    $('#c-step', el).hidden = cur.calc !== 'step';
    if (cur.calc === 'step') {
      const pl = PARAMS[param] || { label: 'Valeur', d: 2 };
      $('#c-cur-l', el).textContent = `${pl.label} mesuré${last[param] != null ? ' (dernier passage)' : ''}`;
      f.elements.cur.value = last[param] != null ? String(last[param]).replace('.', ',') : '';
      const t = st.th[param] && st.th[param].target; f.elements.tgt.value = t != null ? String(t).replace('.', ',') : '';
    }
    compute();
  };
  const compute = () => {
    const V = L.num(f.elements.vol.value), dose = L.num(f.elements.dose.value);
    let q = null, how = '';
    if (cur.calc === 'fixe') { q = L.doseFixed(dose, V); how = `${nf(dose, 2)} ${cur.doseUnit || 'g'}/m³ × ${nf(V, 1)} m³`; }
    else {
      const c = L.num(f.elements.cur.value), t = L.num(f.elements.tgt.value);
      const wrong = c != null && t != null && ((cur.kind === 'ph_minus' && c <= t) || (['ph_plus', 'tac_plus', 'stab', 'sel'].includes(cur.kind) && c >= t));
      if (wrong) { $('#c-res', el).innerHTML = `<span>La valeur mesurée est déjà ${cur.kind === 'ph_minus' ? 'sous' : 'au-dessus de'} la cible : pas de ${esc(cur.name)} à ajouter.</span>`; return; }
      q = L.doseStep(dose, +cur.step, c, t, V);
      how = c != null && t != null ? `${nf(Math.abs(t - c), 2)} ÷ ${nf(cur.step, 2)} × ${nf(dose, 2)} ${cur.doseUnit || 'g'}/m³ × ${nf(V, 1)} m³` : '';
    }
    const pk = L.packsFor(cur, q);
    $('#c-res', el).innerHTML = q == null ? '<span>Renseigne les valeurs pour obtenir la dose.</span>' : `<span>${esc(cur.name)} à ajouter</span><b>${L.fmtQty(q, cur.doseUnit || 'g')}</b><small>${esc(how)}${pk && pk.packs ? ` · soit ${esc(packPlural(pk.packs, cur))}` : ''}</small>`;
    el.dataset.q = q ?? '';
  };
  const drain = () => {
    const c = L.num(f.elements.cyaCur.value), t = L.num(f.elements.cyaTgt.value), V = L.num(f.elements.vol.value);
    const pct = L.drainPct(c, t);
    $('#c-drain', el).innerHTML = c == null || t == null ? '<span>Renseigne les deux valeurs.</span>' : pct <= 0 ? '<span>Pas de vidange nécessaire.</span>' : `<span>À vider puis remplir à l’eau neuve</span><b>${nf(pct * 100, 0)} %</b><small>${V ? `soit ≈ ${nf(pct * V, 1)} m³ sur ${nf(V, 1)} m³` : 'renseigne le volume pour avoir les m³'}</small>`;
  };
  loadProd(); drain();
  el.addEventListener('input', e => { if (e.target.name === 'prod') loadProd(); else if (['cyaCur', 'cyaTgt'].includes(e.target.name)) drain(); else { compute(); if (e.target.name === 'vol') drain(); } });
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    if (b.dataset.v === 'need') {
      const q = L.num(el.dataset.q); const pk = L.packsFor(cur, q);
      await run(put('needs', uid(), { poolId, productId: cur.id, name: cur.name, qty: (pk && pk.packs) || 1, unit: packName(cur), note: q != null ? `Dose calculée : ${L.fmtQty(q, cur.doseUnit || 'g')}` : '', status: 'open', createdAt: Date.now() }), 'Ajouté aux besoins produits');
    } else if (b.dataset.v === 'save-dose') {
      const d = L.num(f.elements.dose.value); if (d == null) return;
      await run(upd('products', cur.id, { dose: d }), `Dose enregistrée pour ${cur.name}`);
    }
  });
}
