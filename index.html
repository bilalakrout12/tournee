  <section class="card"><div class="card-head"><h2>Catalogue produits</h2><button class="btn sm primary" data-action="product" data-id="">+ Nouveau produit</button></div>
    <p class="hint">La dose sert à la calculatrice et aux corrections suggérées. Le conditionnement et son prix servent aux besoins et à la facturation.</p>
    ${pr.length ? `<div class="prodlist">${pr.map(x => `<button class="prodrow" data-action="product" data-id="${x.id}"><span><b>${esc(x.name)}</b><br><span class="muted sm">${dose(x)}</span></span><span>${x.pack ? esc(x.pack) : '<span class="badge warn">Conditionnement à définir</span>'} · ${x.price != null && x.price !== '' ? eur(x.price) : '<span class="badge warn">Prix à renseigner</span>'}</span></button>`).join('')}</div>` : '<p class="muted">Aucun produit. Ajoute au moins pH moins, pH plus, TAC + et chlore choc pour les corrections automatiques.</p>'}
  </section>`;
}
async function saveSettings(patch) { const next = merge(settings(), patch); return run(db.doc('settings/main').set(strip(next)), 'Réglages enregistrés'); }
function openSettings(sec) {
  const st = settings(), th = st.th;
  const val = v => esc(String(v ?? '').replace('.', ','));
  let title = '', html = '';
  if (sec === 'tour') {
    title = 'Tournée';
    html = `<label class="f"><span>Adresse de départ</span><input name="startAddress" value="${esc(st.startAddress)}"></label>
      <label class="f" data-req="gps"><span>GPS du départ</span><input name="startGps" value="${esc(gpsText(st.startGps))}" placeholder="43.27268, 6.58012"><small>Point d’où partent et où reviennent tes tournées. Dans Plans : appui long sur le lieu, puis copie les coordonnées.</small></label>
      <label class="f"><span>Heure de départ</span><input type="time" name="startTime" value="${esc(st.startTime)}"></label>
      <div class="f"><span>Jours de tournée</span><div class="daypick">${[1, 2, 3, 4, 5, 6, 7].map(d => `<label><input type="checkbox" name="workDays" value="${d}" ${(st.workDays || []).map(Number).includes(d) ? 'checked' : ''}><span>${DOW[d]}</span></label>`).join('')}</div></div>`;
  } else if (sec === 'road') {
    title = 'Estimation des trajets';
    html = `<div class="f"><span>Mois de circulation chargée</span><div class="daypick">${MONTHS_S.map((m, i) => `<label><input type="checkbox" name="peak" value="${i + 1}" ${(st.peakMonths || []).map(Number).includes(i + 1) ? 'checked' : ''}><span style="min-width:58px">${m}</span></label>`).join('')}</div></div>
      <div class="grid2"><label class="f"><span>Vitesse moyenne (km/h)</span><input name="speedOff" inputmode="decimal" value="${val(st.speedOff)}"></label><label class="f"><span>Vitesse en période chargée (km/h)</span><input name="speedPeak" inputmode="decimal" value="${val(st.speedPeak)}"></label></div>
      <div class="grid2"><label class="f"><span>Coefficient de détour</span><input name="detour" inputmode="decimal" value="${val(st.detour)}"><small>Distance par la route ÷ distance à vol d’oiseau. 1,3 à 1,5 dans le Golfe.</small></label><label class="f"><span>Temps fixe par arrêt (min)</span><input name="stopOverhead" inputmode="numeric" value="${val(st.stopOverhead)}"><small>Stationnement, portail, accès au local.</small></label></div>`;
  } else if (sec === 'th') {
    title = 'Seuils des constantes';
    const row = (k, label, target) => `<fieldset><legend>${label}</legend><div class="grid3">
      <label class="f"><span>Mini idéal</span><input name="${k}.min" inputmode="decimal" value="${val(th[k].min)}"></label><label class="f"><span>Maxi idéal</span><input name="${k}.max" inputmode="decimal" value="${val(th[k].max)}"></label>
      <label class="f"><span>Alerte sous</span><input name="${k}.alertMin" inputmode="decimal" value="${val(th[k].alertMin)}"></label><label class="f"><span>Alerte au-dessus</span><input name="${k}.alertMax" inputmode="decimal" value="${val(th[k].alertMax)}"></label>
      ${target ? `<label class="f"><span>Cible des corrections</span><input name="${k}.target" inputmode="decimal" value="${val(th[k].target)}"></label>` : ''}</div></fieldset>`;
    html = row('ph', 'pH', true) + row('cl', 'Chlore libre (ppm)') + row('tac', 'TAC (ppm)', true) + row('cya', 'Stabilisant (ppm)', true) + row('redox', 'Redox (mV)') + row('sel', 'Sel (g/L)', true);
  } else if (sec === 'equip') {
    title = 'Durées de vie du matériel';
    html = `<p class="hint">Valeurs par défaut, en mois, quand la fiche ne précise pas de durée.</p><div class="grid3">${Object.entries(st.equipLife).map(([k, v]) => `<label class="f"><span>${LIFE_LABEL[k] || k}</span><input name="life.${k}" inputmode="numeric" value="${val(v)}"></label>`).join('')}</div>`;
  }
  const el = openSheet({ title, html: `<form class="form" id="sform" novalidate>${html}<div id="serr" class="errors" hidden></div></form>`, foot: `<button class="btn primary" data-v="save">Enregistrer</button>` });
  const f = $('#sform', el);
  el.addEventListener('click', async e => {
    if (!e.target.closest('[data-v="save"]')) return;
    const n = name => L.num(f.elements[name].value);
    let patch = {}, err = '';
    if (sec === 'tour') {
      const raw = f.elements.startGps.value.trim(), g = L.parseGps(raw);
      if (raw && !g) err = 'Coordonnées GPS non reconnues. Exemple : 43.27268, 6.58012';
      patch = { startAddress: f.elements.startAddress.value.trim(), startGps: g || null, startTime: f.elements.startTime.value || '08:00', workDays: $$('[name="workDays"]:checked', f).map(i => +i.value) };
    } else if (sec === 'road') {
      patch = { peakMonths: $$('[name="peak"]:checked', f).map(i => +i.value), speedOff: n('speedOff') || 40, speedPeak: n('speedPeak') || 22, detour: n('detour') || 1.35, stopOverhead: n('stopOverhead') ?? 3 };
    } else if (sec === 'th') {
      const t = {};
      ['ph', 'cl', 'tac', 'cya', 'redox', 'sel'].forEach(k => { t[k] = {}; ['min', 'max', 'alertMin', 'alertMax', 'target'].forEach(x => { const elx = f.elements[`${k}.${x}`]; if (elx) { const v = L.num(elx.value); if (v == null) err = 'Tous les seuils doivent être des nombres.'; t[k][x] = v; } }); if (t[k].min > t[k].max) err = `Seuil ${PARAMS[k].label} : le mini dépasse le maxi.`; });
      patch = { th: t };
    } else if (sec === 'equip') {
      const life = {}; Object.keys(st.equipLife).forEach(k => { life[k] = n('life.' + k); });
      patch = { equipLife: life };
    }
    if (err) { const b = $('#serr', el); b.hidden = false; b.textContent = err; return; }
    const ok = await saveSettings(patch); if (ok) closeSheet();
  });
}
function openProduct(id) {
  const p = id ? clone(S.products[id]) : { name: '', kind: 'autre', calc: 'none', dose: '', doseUnit: 'g', step: '', pack: '', packSize: '', packUnit: 'kg', price: '' };
  const kindOpts = Object.entries(PKIND).map(([k, v]) => `<option value="${k}" ${k === p.kind ? 'selected' : ''}>${v}</option>`).join('');
  const val = v => esc(String(v ?? '').replace('.', ','));
  const el = openSheet({
    title: id ? p.name : 'Nouveau produit',
    html: `<form class="form" id="prform" novalidate>
      <label class="f" data-req="name"><span>Nom</span><input name="name" value="${esc(p.name)}" placeholder="Ex. : pH moins micro-billes"></label>
      <fieldset><legend>Conditionnement et prix</legend>
        <div class="grid2"><label class="f" data-req="pack"><span>Conditionnement</span><input name="pack" value="${esc(p.pack || '')}" placeholder="Seau 5 kg, bidon 20 L, sac 25 kg…"></label><label class="f" data-req="price"><span>Prix de vente du conditionnement (€)</span><input name="price" inputmode="decimal" value="${val(p.price)}"></label></div>
        <div class="grid2"><label class="f"><span>Contenance</span><input name="packSize" inputmode="decimal" value="${val(p.packSize)}" placeholder="5"></label><label class="f"><span>Unité de contenance</span><select name="packUnit">${PACK_UNITS.map(u => `<option ${u === (p.packUnit || 'kg') ? 'selected' : ''}>${u}</option>`).join('')}</select></label></div>
        <p class="hint">La contenance permet de convertir une dose calculée en nombre de conditionnements à acheter.</p>
      </fieldset>
      <fieldset><legend>Dosage</legend>
        <div class="grid2"><label class="f"><span>Rôle</span><select name="kind">${kindOpts}</select><small>Sert à proposer le bon produit quand une constante sort de la plage.</small></label>
        <label class="f"><span>Calcul de dose</span><select name="calc"><option value="none" ${p.calc === 'none' ? 'selected' : ''}>Pas de calcul</option><option value="step" ${p.calc === 'step' ? 'selected' : ''}>Par palier (pH, TAC, stabilisant, sel)</option><option value="fixe" ${p.calc === 'fixe' ? 'selected' : ''}>Dose fixe par m³ (traitement choc)</option></select></label></div>
        <div class="grid3" id="pr-dose"><label class="f"><span>Dose</span><input name="dose" inputmode="decimal" value="${val(p.dose)}"></label><label class="f"><span>Unité de dose</span><select name="doseUnit">${['g', 'ml', 'kg'].map(u => `<option ${u === (p.doseUnit || 'g') ? 'selected' : ''}>${u}</option>`).join('')}</select></label><label class="f" id="pr-step"><span>Palier</span><input name="step" inputmode="decimal" value="${val(p.step)}"><small id="pr-step-h"></small></label></div>
        <p class="hint" id="pr-explain"></p>
      </fieldset>
      ${id ? `<button type="button" class="btn ghost danger" data-v="delete" style="justify-self:start">Supprimer ce produit</button>` : ''}
    </form>`,
    foot: `<button class="btn primary" data-v="save">Enregistrer</button>`
  });
  const f = $('#prform', el);
  const refresh = () => {
    const calc = f.elements.calc.value, kind = f.elements.kind.value, param = PARAM_OF[kind];
    $('#pr-dose', el).hidden = calc === 'none'; $('#pr-step', el).hidden = calc !== 'step';
    $('#pr-step-h', el).textContent = param ? STEP_LABEL[param] : '';
    const d = f.elements.dose.value || '?', u = f.elements.doseUnit.value, s = f.elements.step.value || '?';
    $('#pr-explain', el).textContent = calc === 'step' ? `Lecture : ${d} ${u} par m³ font varier de ${s} ${param ? STEP_LABEL[param] : 'unité'}.` : calc === 'fixe' ? `Lecture : ${d} ${u} par m³ à chaque traitement.` : '';
  };
  refresh(); f.addEventListener('input', refresh);
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    if (b.dataset.v === 'delete') { if (!armed(b, 'Confirmer la suppression')) return; closeSheet(); await run(del('products', id), 'Produit supprimé'); return; }
    if (b.dataset.v !== 'save') return;
    const name = f.elements.name.value.trim(); if (!name) { f.querySelector('[data-req="name"]').classList.add('missing'); return; }
    const doc = { name, kind: f.elements.kind.value, calc: f.elements.calc.value, dose: L.num(f.elements.dose.value), doseUnit: f.elements.doseUnit.value, step: L.num(f.elements.step.value), pack: f.elements.pack.value.trim(), packSize: L.num(f.elements.packSize.value), packUnit: f.elements.packUnit.value, price: L.num(f.elements.price.value) };
    if (doc.calc === 'step' && (!doc.dose || !doc.step)) { toast('Renseigne la dose et le palier.', true); return; }
    if (doc.calc === 'fixe' && !doc.dose) { toast('Renseigne la dose.', true); return; }
    closeSheet();
    await run(put('products', id || uid(), doc), 'Produit enregistré');
  });
}

/* ---------- Actions globales ---------- */
const ACTIONS = {
  week: b => { UI.week = L.addDays(UI.week, +b.dataset.delta); UI.day = L.weekDays(UI.week).includes(today()) ? today() : UI.week; render(); },
  'week-today': () => { UI.week = L.mondayOf(today()); UI.day = today(); render(); },
  'pick-day': b => { UI.day = b.dataset.date; render(); },
  'fill-week': () => fillWeek(),
  optimize: b => optimizeDay(b.dataset.date),
  'add-stop': b => openAddStop(b.dataset.date),
  stop: b => openStop(b.dataset.id),
  pool: b => { UI.poolId = b.dataset.id; render(); window.scrollTo(0, 0); },
  'new-pool': () => openPoolForm(null),
  'edit-pool': b => openPoolForm(b.dataset.id),
  'back-pools': () => { UI.poolId = null; render(); },
  calc: b => openCalc(b.dataset.id),
  visit: b => openVisit(b.dataset.id),
  copy: b => copy(b.dataset.text),
  'pool-visit': b => {
    const pid = b.dataset.id, t = today();
    const ex = dayStops(t).find(s => s.poolId === pid && s.status !== 'fait');
    if (ex) { openValidation(ex.id); return; }
    const list = dayStops(t), id = uid();
    const stop = { poolId: pid, date: t, type: 'entretien', priority: false, status: 'prevu', order: list.length ? Math.max(...list.map(s => s.order ?? 0)) + 1 : 0, createdAt: Date.now() };
    S.stops[id] = { id, ...stop };
    put('stops', id, stop).catch(e => toast(errMsg(e), true));
    openValidation(id);
  },
  'archive-pool': async b => {
    if (!armed(b, 'Confirmer l’archivage')) return;
    const id = b.dataset.id, fut = Object.values(S.stops).filter(s => s.poolId === id && s.status !== 'fait' && s.date >= today());
    const ok = await run([upd('pools', id, { active: false }), ...fut.map(s => del('stops', s.id))], `Fiche archivée${fut.length ? `, ${fut.length} passage${fut.length > 1 ? 's' : ''} à venir retiré${fut.length > 1 ? 's' : ''}` : ''}`);
    if (ok) { UI.poolId = null; render(); }
  },
  'add-need': () => openAddNeed(),
  'need-buy': b => openBuy(b.dataset.id),
  'need-del': async b => { if (!armed(b, 'Confirmer')) return; await run(del('needs', b.dataset.id), 'Besoin supprimé'); },
  'bill-month': b => { UI.billMonth = L.addMonths(UI.billMonth, +b.dataset.delta); render(); },
  'bill-toggle': b => { UI.openBill[b.dataset.id] = !UI.openBill[b.dataset.id]; render(); },
  'bill-invoiced': async b => { const k = `${b.dataset.id}_${UI.billMonth}`; await run(S.invoiced[k] ? del('invoiced', k) : put('invoiced', k, { at: new Date().toISOString() })); },
  'line-del': async b => { if (!armed(b, 'Suppr.')) return; const id = b.dataset.id; if (S.extraLines[id]) delete S.extraLines[id]; await run(del('lines', id), 'Ligne supprimée'); },
  'add-line': b => openAddLine(b.dataset.pool || null),
  'export-csv': () => exportCsv(),
  'edit-settings': b => openSettings(b.dataset.sec),
  backup: () => openBackup(),
  product: b => openProduct(b.dataset.id || null)
};
document.addEventListener('click', e => {
  if (e.target.closest('#sheet-root')) return;
  const tab = e.target.closest('[data-tab]');
  if (tab) { setTab(tab.dataset.tab); return; }
  const t = e.target.closest('[data-action]'); if (!t) return;
  const fn = ACTIONS[t.dataset.action]; if (!fn) return;
  if (!db && t.dataset.action !== 'copy') { toast('Stockage local indisponible.', true); return; }
  fn(t, e);
});

boot();
window.addEventListener('online', schedule); window.addEventListener('offline', schedule);
if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
})();
</script>
</body>
</html>
